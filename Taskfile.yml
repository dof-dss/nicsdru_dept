# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  PATH_THEME: web/themes/custom/nicsdru_dept_theme
  PATH_ORIGINS_MODULES: web/modules/origins
  REPO_PLAYWRIGHT: https://github.com/dof-dss/Playwright-Departmental playwright
  REPO_ORIGINS_MODULES: https://github.com/dof-dss/nicsdru_origins_modules.git
  BRANCH_ORIGINS_MODULES: 10.x-dev

tasks:
  playwright-install:
    desc: Install playwright tests
    status:
      - test -d playwright
    cmds:
      - git clone {{.REPO_PLAYWRIGHT}}
      - cd playwright && npm install
      - cd playwright && npx playwright install
    silent: true

  playwright-list-tags:
    desc: List all tags used in the playwright tests (optionally pass a directory, e.g. task playwright-tags -- tests/smoke)
    aliases: [ply-list-tags]
    dir: playwright
    cmds:
      - npx playwright test --list --reporter=json {{.CLI_ARGS}} | jq -r '[.. | .tags? // empty | .[]] | unique | .[]'
    silent: true

  playwright-test-tags:
    desc: Choose tags from a checkbox list and run the matching playwright tests
    aliases: [ply-tags]
    dir: playwright
    interactive: true
    silent: true
    preconditions:
      - sh: command -v gum
        msg: gum is required. Install it with 'brew install gum'.
    cmds:
      - |
        TAGS=$(npx playwright test --list --reporter=json | jq -r '[.. | .tags? // empty | .[]] | unique | .[]')
        if [ -z "$TAGS" ]; then
          echo "No tags found."
          exit 0
        fi
        SELECTED=$(echo "$TAGS" | gum choose --no-limit --header "Select tags (space to toggle, enter to confirm)")
        if [ -z "$SELECTED" ]; then
          echo "No tags selected."
          exit 0
        fi
        echo "Selected tags:"
        echo "$SELECTED" | sed 's/^/  /'
        gum confirm "Run tests with these tags?" || exit 0
        GREP=$(echo "$SELECTED" | paste -sd'|' -)
        npx playwright test --grep "$GREP"


  playwright-report:
    desc: Display the playwright report
    aliases: [ply-report]
    dir: playwright
    cmds:
      - npx playwright show-report
    silent: true

  playwright-help:
    desc: Display the README from the playwright directory
    preconditions:
      - sh: test -f playwright/README.md
        msg: playwright/README.md not found. Run 'task playwright-install' first.
    cmds:
      - bat playwright/README.md
    silent: true

  theme-install:
    desc: Install the theme npm dependencies
    dir: '{{.PATH_THEME}}'
    cmds:
      - ddev npm install

  theme-css-compile:
    desc: Compile the theme SCSS
    aliases: [tcc]
    dir: '{{.PATH_THEME}}'
    cmds:
      - ddev npm run css

  theme-css-watch:
    desc: Watch and compile the theme SCSS
    aliases: [tcw]
    dir: '{{.PATH_THEME}}'
    cmds:
      - ddev npm run watch-scss

  dev-origins-modules:
    desc: Clone the Origins modules and check out the development branch
    aliases: [dev-origins]
    cmds:
      - rm -rf {{.PATH_ORIGINS_MODULES}}
      - git clone {{.REPO_ORIGINS_MODULES}} {{.PATH_ORIGINS_MODULES}}
      - git -C {{.PATH_ORIGINS_MODULES}} checkout {{.BRANCH_ORIGINS_MODULES}}
