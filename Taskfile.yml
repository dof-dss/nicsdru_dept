# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  PATH_THEME: web/themes/custom/nicsdru_dept_theme
  PATH_ORIGINS_MODULES: web/modules/origins
  REPO_PLAYWRIGHT: https://github.com/dof-dss/Playwright-Departmental playwright
  REPO_ORIGINS_MODULES: https://github.com/dof-dss/nicsdru_origins_modules.git
  BRANCH_ORIGINS_MODULES: 10.x-dev

tasks:
  playwright-install:
    desc: Install playwright tests
    status:
      - test -d playwright
    cmds:
      - git clone {{.REPO_PLAYWRIGHT}}
      - cd playwright && npm install
      - cd playwright && npx playwright install
    silent: true

  playwright-tags:
    desc: List all tags used in the playwright tests (optionally pass a directory, e.g. task playwright-tags -- tests/smoke)
    aliases: [ply-tags]
    dir: playwright
    cmds:
      - npx playwright test --list --reporter=json {{.CLI_ARGS}} | jq -r '[.. | .tags? // empty | .[]] | unique | .[]'
    silent: true

  playwright-help:
    desc: Display the README from the playwright directory
    preconditions:
      - sh: test -f playwright/README.md
        msg: playwright/README.md not found. Run 'task playwright-install' first.
    cmds:
      - bat playwright/README.md
    silent: true

  theme-install:
    desc: Install the theme npm dependencies
    dir: '{{.PATH_THEME}}'
    cmds:
      - ddev npm install

  theme-css-compile:
    desc: Compile the theme SCSS
    aliases: [tcc]
    dir: '{{.PATH_THEME}}'
    cmds:
      - ddev npm run css

  theme-css-watch:
    desc: Watch and compile the theme SCSS
    aliases: [tcw]
    dir: '{{.PATH_THEME}}'
    cmds:
      - ddev npm run watch-scss

  dev-origins-modules:
    desc: Clone the Origins modules and check out the development branch
    aliases: [dev-origins]
    cmds:
      - rm -rf {{.PATH_ORIGINS_MODULES}}
      - git clone {{.REPO_ORIGINS_MODULES}} {{.PATH_ORIGINS_MODULES}}
      - git -C {{.PATH_ORIGINS_MODULES}} checkout {{.BRANCH_ORIGINS_MODULES}}
