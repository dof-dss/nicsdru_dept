javascript: |-
  (function ($, Drupal) {
    // Add better HTML5 native date validation to the complaint date field.
    // Webform's only works server-side.
    Drupal.behaviors.dataProtectionComplaintDateFix = {
      attach: function (context, settings) {
        const dataProtectionComplaintDate = once('dataProtectionComplaintDateFix', 'input[name="datetime_complaint"]', context);
        dataProtectionComplaintDate.forEach(function (input) {
          const today = new Date();
          const year = today.getFullYear();
          const month = String(today.getMonth() + 1).padStart(2, '0');
          const day = String(today.getDate()).padStart(2, '0');
          const maxDate = `${year}-${month}-${day}`;
          const minDate = `${year - 100}-${month}-${day}`;

          input.setAttribute('min', minDate);
          input.setAttribute('max', maxDate);
          
          const minMessage = "Enter a date that is not more than 100 years ago.";
          const maxMessage = "The date cannot be in the future.";

          input.addEventListener('input', function () {
            input.setCustomValidity('');
            
            if (input.validity.rangeUnderflow) {
              input.setCustomValidity(minMessage);
            } else if (input.validity.rangeOverflow) {
              input.setCustomValidity(maxMessage);
            }
          });

          input.addEventListener('invalid', function () {
            if (input.validity.rangeUnderflow) {
              input.setCustomValidity(minMessage);
            } else if (input.validity.rangeOverflow) {
              input.setCustomValidity(maxMessage);
            }
          });
        });
      }
    };
  })(jQuery, Drupal);
