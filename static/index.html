<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website temporarily unavailable</title>
    <style>
      html {
        color: #222;
        background: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
      }

      body {
        margin: 0;
        padding: 3rem 1.25rem;
      }

      main {
        box-sizing: border-box;
        max-width: 42rem;
        margin: 0 auto;
        padding: clamp(1.5rem, 5vw, 3rem);
        border-top: 0.375rem solid #005ea5;
        background: #fff;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        line-height: 1.2;
      }

      p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Website temporarily unavailable</h1>
      <p>We are carrying out essential maintenance. Please try again later.</p>
      <p>We apologise for any inconvenience.</p>
    </main>
  </body>
</html>
